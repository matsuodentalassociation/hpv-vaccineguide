<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7FAF9">
<meta name="hpv-lp-app" content="hpv-vaccineguide">
<meta name="hpv-lp-version" content="5">
<title>あなたの将来のために。｜HPVガイド V5</title>
<style id="lp-style">
:root{
  --bg:#F7FAF9;--paper:#FFFFFF;--navy:#142740;
  --text:#263C50;--muted:#526777;--teal:#08796F;
  --teal-dark:#065B54;--mint:#E3F5EF;--cyan:#00D5EA;
  --line:#D4E3DF;--warm:#9B4832;--warm-bg:#FFF2EC;
  --shadow:0 8px 26px #17392f09
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--navy)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif}
button,textarea{font:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent}
a{color:var(--teal-dark);text-underline-offset:4px}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
h1,h2,h3,p{margin:0}
.app{height:100vh;height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.app::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.chapter{
  height:100vh;height:100dvh;scroll-snap-align:start;
  scroll-snap-stop:always;display:flex;flex-direction:column;
  overflow:hidden;position:relative;
  background:radial-gradient(ellipse at 95% 30%,#E7F6EF,transparent 65%),var(--bg)
}
.chapter.risk{background:radial-gradient(ellipse at 95% 30%,#FFF0E7,transparent 65%),var(--bg)}
.top{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  gap:10px;min-height:58px;padding:12px 20px;
  padding-top:max(12px,env(safe-area-inset-top));
  border-bottom:1px solid var(--line)
}
.brand{font-size:10px;font-weight:850;letter-spacing:.12em;white-space:nowrap}
.brand b{color:var(--teal)}
.edition{font-size:10px;line-height:1.5;color:var(--muted);border:1px solid var(--line);border-radius:24px;padding:5px 9px;background:#ffffff90}
.rail{
  display:flex;flex:1;min-height:0;gap:10px;padding:12px 12px 8px;
  overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:12px;
  scrollbar-width:none;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch
}
.slide{
  flex:0 0 calc(100% - 16px);min-width:0;scroll-snap-align:start;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  border:1px solid var(--line);border-radius:25px;
  background:var(--paper);box-shadow:var(--shadow)
}
.slide::before{
  content:"";position:absolute;top:0;left:26px;width:62px;height:3px;
  border-radius:0 0 4px 4px;background:var(--teal)
}
.slide.detail{background:#F0F7F4}
.slide-inner{
  flex:1;min-height:0;overflow-y:auto;padding:24px 22px 20px;
  scrollbar-width:thin;scrollbar-color:#A1BEB5 transparent;
  overflow-wrap:anywhere
}
.tag{
  font-size:10px;line-height:1.5;letter-spacing:.1em;font-weight:850;
  color:var(--teal);margin-bottom:15px;display:flex;align-items:center;gap:8px
}
.tag::before{content:"";width:6px;height:6px;background:var(--teal);border-radius:50%;flex-shrink:0}
.headline{font-size:clamp(28px,8.2vw,40px);line-height:1.38;letter-spacing:-.055em;font-weight:900}
.accent{color:var(--teal)}
.warm{color:var(--warm)}
.subline{font-size:15px;font-weight:750;line-height:1.8;margin-top:18px}
.body{font-size:13px;color:var(--muted);line-height:1.85;margin-top:12px}
.caption{font-size:11px;color:var(--muted);line-height:1.8;margin-top:10px}
.promise{font-size:12px;color:var(--text);line-height:1.85;border-left:3px solid var(--teal);padding:2px 0 2px 12px;margin-top:16px}
.visual{max-width:340px;margin:20px auto 12px}
svg{display:block;width:100%;height:auto}
.hint{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:8px 15px;border-top:1px solid var(--line);
  font-size:11px;line-height:1.6;color:var(--teal-dark);background:#FBFDFC
}
.hint button{border:0;background:transparent;color:var(--teal-dark);font-size:11px;min-height:36px;padding:5px 8px;font-weight:800}
.navigation{flex-shrink:0;padding:3px 20px max(12px,env(safe-area-inset-bottom))}
.horizontal{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.horizontal>button{border:1px solid var(--line);background:white;color:var(--teal);border-radius:10px;width:38px;min-height:34px;font-size:19px}
.dots{display:flex;gap:2px}
.dots button{border:0;background:transparent;width:30px;height:36px;display:grid;place-items:center;padding:0}
.dots button::after{content:"";width:7px;height:7px;border-radius:50%;background:#A8BDB5}
.dots button[aria-current=true]::after{width:20px;border-radius:5px;background:var(--teal)}
.vertical{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px}
.vertical button{border:1px solid var(--line);border-radius:11px;min-height:42px;padding:9px 12px;background:white;color:var(--navy);font-size:11px;font-weight:750}
.vertical .next{background:var(--teal);border-color:var(--teal);color:white}
.count{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
button:disabled{opacity:.35;cursor:default}
.detail h2{font-size:26px;line-height:1.45;letter-spacing:-.04em;margin-bottom:18px}
.info{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:16px;background:white}
.info h3{font-size:15px;line-height:1.6;margin-bottom:7px}
.info p{font-size:13px;line-height:1.9;color:var(--muted)}
.info.positive{background:var(--mint);border-color:#B7DCD0}
.info.positive h3{color:var(--teal-dark)}
.info.caution{background:var(--warm-bg);border-color:#E7C6B9}
.info.caution h3{color:var(--warm)}
.source{font-size:11px;line-height:1.85;color:var(--muted);margin-top:18px}
.source a{display:inline-block;margin-top:5px}
.choices,.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
button{position:relative;overflow:hidden;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s}
button:not(:disabled):active{transform:translateY(2px) scale(.985);box-shadow:inset 0 2px 5px #14274017}
.choice,.action{
  border:1px solid #B7CDC4;border-radius:13px;background:white;color:var(--navy);
  padding:12px 13px;min-height:46px;line-height:1.6;font-size:12px;font-weight:750
}
.action.primary{background:var(--teal);border-color:var(--teal);color:white}
.choice[aria-pressed=true]{
  background:var(--mint);border:2px solid var(--teal-dark);
  padding:11px 12px;color:var(--teal-dark);box-shadow:0 2px 7px #08796f12
}
.choice[aria-pressed=true]::before{content:"✓";font-weight:900;margin-right:7px}
.ripple{
  position:absolute;border-radius:50%;background:#00D5EA55;
  pointer-events:none;animation:ripple .65s ease-out forwards
}
@keyframes ripple{from{transform:scale(0);opacity:.95}to{transform:scale(1);opacity:0}}
.response{
  border-radius:14px;background:var(--mint);border:1px solid #BEDDD1;
  padding:13px;margin-top:14px;font-size:13px;line-height:1.85;color:var(--teal-dark)
}
.flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin:24px 0}
.flow span{padding:14px 12px;border:1px solid #BAD8CD;border-radius:13px;background:var(--mint);font-size:13px;font-weight:750;text-align:center}
.flow b{color:var(--teal)}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0}
.types span{background:var(--mint);color:var(--teal-dark);border:1px solid #BEDDD1;border-radius:14px;padding:13px;text-align:center;font-size:23px;font-weight:850}
.metric{background:var(--mint);border:1px solid #BEDDD1;border-radius:20px;padding:20px;margin-top:20px}
.big-type{font-size:63px;line-height:1.2;font-weight:900;color:var(--teal-dark);margin-top:10px}
.big-type small{font-size:25px}
details{border:1px solid var(--line);border-radius:14px;background:white;margin-top:12px;overflow:hidden}
summary{cursor:pointer;position:relative;padding:15px;font-size:14px;font-weight:800;line-height:1.7;color:var(--navy);transition:background .15s;min-height:48px}
summary:active{background:var(--mint)}
details[open]{border-color:var(--teal)}
details[open] summary{background:var(--mint);color:var(--teal-dark)}
details p{font-size:13px;line-height:1.85;color:var(--muted);padding:0 15px 15px;margin-top:12px}
label{display:block;font-size:13px;line-height:1.8;margin-top:16px}
textarea{width:100%;min-height:180px;resize:vertical;border:1px solid #A5C5B7;border-radius:13px;background:white;color:var(--navy);padding:13px;font-size:13px;line-height:1.85;margin-top:10px}
.share-area{border-top:1px solid var(--line);padding-top:22px;margin-top:25px}
.share-area h3{font-size:21px;line-height:1.5}
.qr{width:216px;min-height:216px;padding:12px;background:white;margin:18px auto;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center}
.qr svg{width:190px;height:190px}
.qr p{font-size:12px;line-height:1.8;text-align:center;color:var(--muted)}
.url{font-size:11px;line-height:1.85;word-break:break-all}
.toast{
  position:fixed;bottom:max(15px,env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);width:390px;max-width:calc(100% - 28px);
  background:white;border:1px solid #9CCDBB;border-radius:16px;
  padding:15px;box-shadow:0 8px 35px #14274025;
  font-size:13px;line-height:1.7;z-index:20
}
.toast[hidden]{display:none}
.toast .action{margin:10px 8px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(min-width:600px){
  body{display:flex;justify-content:center;background:#E9F1ED}
  .app{width:430px;border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 60px #1427400c}
  .headline{font-size:35px}
}
@media(max-height:730px){
  .top{min-height:47px}
  .slide-inner{padding-top:19px}
  .headline{font-size:28px}
  .visual{max-width:260px;margin-top:14px;margin-bottom:8px}
  .subline{font-size:13px;margin-top:12px}
  .body{font-size:12px;margin-top:9px}
  .tag{margin-bottom:11px}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;animation:none!important;transition:none!important}
  button:not(:disabled):active{transform:none}
}
</style>
</head>
<body>

<div class="sr" id="status" role="status" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

const app=document.getElementById('app');
const status=document.getElementById('status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const behavior=()=>reduced.matches?'auto':'smooth';
const lifecycle=new AbortController();
const listen=(target,event,handler,options={})=>
  target.addEventListener(event,handler,{...options,signal:lifecycle.signal});
let active=0,toastTimer,resizeTimer,destroyed=false;

app.innerHTML=themes.map((t,i)=>`
<section class="chapter ${t.risk?'risk':''}" aria-label="${i+1} ${t.label}">
  <header class="top">
    <div class="brand">FUTURE <b>SELF-CARE</b></div>
    <span class="edition">${i===0?'白ベース V5｜全12話':t.label}</span>

  <div class="rail" tabindex="0" aria-label="テーマ${i+1}の主画面と補足">
    <article class="slide">
      <div class="slide-inner">
        <p class="tag">${String(i+1).padStart(2,'0')} / ${t.en}</p>
        <${i===0?'h1':'h2'} class="headline">${t.title}</${i===0?'h1':'h2'}>
        ${t.visual||''}
        <p class="subline">${t.sub}</p>
        ${t.body?`<p class="body">${t.body}</p>`:''}
        ${t.extra||''}
      </div>
      <div class="hint"><span>横で深掘り／下で次の話</span><button data-detail>詳しく →</button></div>
    </article>
    ${t.details.map((d,n)=>`
    <article class="slide detail">
      <div class="slide-inner">
        <p class="tag">${String(i+1).padStart(2,'0')} / DEEP DIVE ${n+1}</p>
        <h2>${d.title}</h2>${d.content}
      </div>
      <div class="hint"><span>← 左で前の画面へ</span><span>補足 ${n+1} / ${t.details.length}</span></div>
    </article>`).join('')}
  </div>
</section>`).join('');

const chapters=[...app.querySelectorAll('.chapter')];
const states=[];

function say(text,duration=4500){
  const toast=document.getElementById('toast');
  toast.textContent=text;toast.hidden=false;status.textContent=text;
  clearTimeout(toastTimer);
  if(duration)toastTimer=setTimeout(()=>toast.hidden=true,duration);
}

function verticalGo(index,instant=false){
  if(!chapters[index]||destroyed)return;
  active=index;
  app.scrollTo({
    top:chapters[index].offsetTop-chapters[0].offsetTop,
    behavior:instant?'auto':behavior()
  });
}

chapters.forEach((chapter,index)=>{
  const rail=chapter.querySelector('.rail');
  const slides=[...rail.children];
  let current=0,frame;
  const nav=document.createElement('nav');
  nav.className='navigation';
  nav.setAttribute('aria-label',`テーマ${index+1}の操作`);
  nav.innerHTML=`
    <div class="horizontal">
      <button class="left" aria-label="前の横画面">←</button>
      <div class="dots">${slides.map((_,n)=>`<button aria-label="${n===0?'主画面':'補足画面'+n}" aria-current="${n===0}"></button>`).join('')}</div>
      <button class="right" aria-label="次の横画面">→</button>
    </div>
    <div class="vertical">
      <button class="previous" ${index===0?'disabled':''}>↑ 前の話</button>
      <span class="count">${String(index+1).padStart(2,'0')} / ${chapters.length}</span>
      <button class="next">${index===chapters.length-1?'最初に戻る ↺':'次の話 ↓'}</button>
    </div>`;
  chapter.append(nav);
  const left=nav.querySelector('.left'),right=nav.querySelector('.right');
  const dots=[...nav.querySelectorAll('.dots button')];

  function go(n,instant=false){
    n=Math.max(0,Math.min(slides.length-1,n));
    rail.scrollTo({
      left:slides[n].offsetLeft-slides[0].offsetLeft,
      behavior:instant?'auto':behavior()
    });
    if(instant)update(n);
  }
  function update(n){
    current=n;left.disabled=n===0;right.disabled=n===slides.length-1;
    dots.forEach((dot,i)=>dot.setAttribute('aria-current',String(i===n)));
  }
  update(0);
  dots.forEach((dot,n)=>listen(dot,'click',()=>go(n)));
  listen(left,'click',()=>go(current-1));
  listen(right,'click',()=>go(current+1));
  listen(chapter.querySelector('[data-detail]'),'click',()=>go(1));
  listen(nav.querySelector('.previous'),'click',()=>verticalGo(index-1));
  listen(nav.querySelector('.next'),'click',()=>verticalGo(index===chapters.length-1?0:index+1));
  listen(rail,'scroll',()=>{
    cancelAnimationFrame(frame);
    frame=requestAnimationFrame(()=>{
      if(destroyed)return;
      let nearest=0,best=Infinity;
      slides.forEach((slide,n)=>{
        const distance=Math.abs(rail.scrollLeft-(slide.offsetLeft-slides[0].offsetLeft));
        if(distance<best){best=distance;nearest=n;}
      });
      update(nearest);
    });
  },{passive:true});
  listen(rail,'keydown',event=>{
    if(event.target!==rail)return;
    const actions={
      ArrowRight:()=>go(current+1),ArrowLeft:()=>go(current-1),
      ArrowDown:()=>verticalGo(index+1),ArrowUp:()=>verticalGo(index-1)
    };
    if(actions[event.key]){event.preventDefault();actions[event.key]();}
  });
  states.push({rail,go,get current(){return current;}});
});

const observer=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting&&entry.intersectionRatio>.6){
      active=chapters.indexOf(entry.target);
      status.textContent=`テーマ${active+1} / ${chapters.length}：${themes[active].label}`;
    }
  });
},{root:app,threshold:.65});
chapters.forEach(chapter=>observer.observe(chapter));

listen(window,'resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    if(destroyed)return;
    verticalGo(active,true);
    states.forEach(s=>s.go(s.current,true));
  },180);
});

/*
 * 反応の役割分担：
 * 押している間＝CSSの沈み込み
 * 操作直後＝シアンの波紋
 * 選択結果＝淡いミント＋濃い枠線＋チェック
 * 波紋はクリックに結び付け、キーボード操作にも対応。
 */
listen(document,'click',event=>{
  const button=event.target.closest('button:not(:disabled)');
  if(!button||reduced.matches)return;
  const rect=button.getBoundingClientRect();
  const size=Math.hypot(rect.width,rect.height)*2;
  const ripple=document.createElement('span');
  ripple.className='ripple';
  ripple.setAttribute('aria-hidden','true');
  const keyboard=event.detail===0;
  const x=keyboard?rect.width/2:event.clientX-rect.left;
  const y=keyboard?rect.height/2:event.clientY-rect.top;
  ripple.style.cssText=`width:${size}px;height:${size}px;left:${x-size/2}px;top:${y-size/2}px`;
  button.append(ripple);
  setTimeout(()=>ripple.remove(),700);
});

async function copy(text,message='コピーしました。'){
  try{
    if(!navigator.clipboard||!isSecureContext)throw new Error('Clipboard unavailable');
    await navigator.clipboard.writeText(text);
    say(message);
  }catch(error){
    const temporary=document.createElement('textarea');
    temporary.value=text;
    temporary.style.cssText='position:fixed;left:0;top:0;opacity:0';
    document.body.append(temporary);
    temporary.focus();temporary.select();
    let ok=false;
    try{ok=document.execCommand('copy');}catch(_){}
    temporary.remove();
    say(ok?message:'自動コピーできません。表示されているURLまたはメモを選択してコピーしてください。');
    if(!ok&&text===note.value){note.focus();note.select();}
  }
}

listen(document.getElementById('copy-link'),'click',()=>copy(CONFIG.url,'✓ リンクをコピーしました。'));
listen(document.getElementById('copy-note'),'click',()=>copy(note.value,'✓ メモをコピーしました。送る相手を確認してください。'));
listen(document.getElementById('share'),'click',async()=>{
  if(!navigator.share){
    await copy(CONFIG.url,'✓ リンクをコピーしました。メッセージに貼り付けて送れます。');
    return;
  }
  try{
    await navigator.share({
      title:'あなたの将来のために。HPVガイド',
      text:'一緒に見て、話してみよう。',url:CONFIG.url
    });
  }catch(error){
    if(error.name!=='AbortError')await copy(CONFIG.url);
  }
});

/*
 * QRは端末内で生成。外部QR生成APIにURLやメモを送らない。
 * 固定版ライブラリをCDNから取得するため初回は通信が必要。
 * 失敗時もリンク共有は使用可能。
 */
let qrLoading=false,qrTimeout,qrScript;
function qrFailed(){
  if(destroyed)return;
  qrLoading=false;
  document.getElementById('qr').innerHTML=
    '<p>QRを読み込めませんでした。<br>共有ボタンも使えます。<br><button class="action" id="qr-retry">再試行</button></p>';
  listen(document.getElementById('qr-retry'),'click',loadQR);
}
function renderQR(){
  if(destroyed)return;
  try{
    const qr=window.qrcode(0,'M');
    qr.addData(CONFIG.url);qr.make();
    const count=qr.getModuleCount(),quiet=4,size=count+quiet*2;
    let path='';
    for(let y=0;y<count;y++){
      for(let x=0;x<count;x++){
        if(qr.isDark(y,x))path+=`M${x+quiet} ${y+quiet}h1v1h-1z`;
      }
    }
    document.getElementById('qr').innerHTML=
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}"
        role="img" aria-label="このHPVガイドを開くQRコード" shape-rendering="crispEdges">
        <rect width="${size}" height="${size}" fill="white"/>
        <path d="${path}" fill="black"/>
      </svg>`;
    qrLoading=false;
  }catch(error){qrFailed();}
}
function loadQR(){
  if(qrLoading||destroyed)return;
  if(typeof window.qrcode==='function'){renderQR();return;}
  qrLoading=true;
  document.getElementById('qr').innerHTML='<p>QRコードを準備しています…</p>';
  qrScript=document.createElement('script');
  qrScript.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js?v='+encodeURIComponent(CONFIG.build);
  qrScript.async=true;
  qrScript.crossOrigin='anonymous';
  qrTimeout=setTimeout(()=>{
    qrScript.onload=null;qrScript.onerror=null;
    qrScript.remove();qrFailed();
  },15000);
  qrScript.onload=()=>{clearTimeout(qrTimeout);renderQR();};
  qrScript.onerror=()=>{clearTimeout(qrTimeout);qrScript.remove();qrFailed();};
  document.head.append(qrScript);
}
loadQR();

/*
 * 更新時だけ表示位置・メモを同一タブ内に一時退避。
 * 復元後すぐ削除。通常の閲覧中にはメモを保存しない。
 */
const STATE_KEY='hpv-lp-update-state';
function saveView(){
  const value={
    active,horizontal:states.map(s=>s.current),
    inner:chapters.map(c=>[...c.querySelectorAll('.slide-inner')].map(x=>x.scrollTop)),
    note:note.value,feeling,safety:safety.checked,time:Date.now()
  };
  try{sessionStorage.setItem(STATE_KEY,JSON.stringify(value));return true;}
  catch(error){return false;}
}
try{
  const raw=sessionStorage.getItem(STATE_KEY);
  sessionStorage.removeItem(STATE_KEY);
  if(raw){
    const saved=JSON.parse(raw);
    if(Date.now()-saved.time<300000){
      if(typeof saved.note==='string')note.value=saved.note;
      safety.checked=Boolean(saved.safety);
      const button=[...document.querySelectorAll('[data-feeling]')]
        .find(b=>b.dataset.feeling===saved.feeling);
      if(button)button.click();
      requestAnimationFrame(()=>{
        if(destroyed)return;
        verticalGo(Math.max(0,Math.min(11,Number(saved.active)||0)),true);
        states.forEach((s,i)=>s.go(saved.horizontal?.[i]||0,true));
        requestAnimationFrame(()=>{
          if(destroyed)return;
          chapters.forEach((c,i)=>{
            [...c.querySelectorAll('.slide-inner')].forEach((el,j)=>{
              el.scrollTop=saved.inner?.[i]?.[j]||0;
            });
          });
        });
      });
    }
  }
}catch(error){}

/*
 * 最新版確認・適用：
 * 対象ファイルの最新コミットをGitHub APIで確認し、
 * SHA固定のraw HTMLを取得して検証後に適用する。
 * API/rawには時刻パラメータ＋cache:'no-store'を使用。
 * CDN資産にはビルド番号を付けてキャッシュを区別。
 *
 * GitHub Pagesの公開先でのみ有効。
 * ローカルV5をGitHub上の旧版に戻すことはしない。
 * アプリ名と版の検証は誤適用防止用であり、
 * リポジトリ所有者のコードを信頼して実行する設計。
 */
const publicURL=new URL(CONFIG.url);
const updateEnabled=
  location.protocol==='https:'&&
  location.hostname===publicURL.hostname&&
  location.pathname.startsWith(publicURL.pathname);
let checking=false,lastCheck=0,pendingHTML='',pendingSHA='';
let updateInterval,startTimer;
const APPLIED_KEY='hpv-lp-applied-sha';
const fetchControllers=new Set();

function updateLabel(text){
  const label=document.getElementById('update-state');
  if(label)label.textContent='V5｜'+text;
}
function rememberedSHA(){
  try{return sessionStorage.getItem(APPLIED_KEY)||'';}
  catch(error){return '';}
}
async function getFresh(url,type='json'){
  const target=new URL(url);
  target.searchParams.set('_cb',Date.now().toString());
  const controller=new AbortController();
  fetchControllers.add(controller);
  const timer=setTimeout(()=>controller.abort(),12000);
  try{
    const response=await fetch(target.href,{
      cache:'no-store',credentials:'omit',signal:controller.signal,
      headers:type==='json'?{Accept:'application/vnd.github+json'}:{}
    });
    if(!response.ok)throw new Error('HTTP '+response.status);
    return type==='json'?await response.json():await response.text();
  }finally{
    clearTimeout(timer);fetchControllers.delete(controller);
  }
}

function validateHTML(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
     const marker=doc.querySelector('meta[name="hpv-lp-app"]');
    const version=Number(
      doc.querySelector('meta[name="hpv-lp-version"]')?.content
    );

    if(
      marker?.content!=='hpv-vaccineguide' ||
      !Number.isFinite(version) ||
      version<CONFIG.version ||
      !doc.querySelector('#lp-style') ||
      !doc.querySelector('#lp-code') ||
      !doc.querySelector('#app')
    ){
      throw new Error('更新ファイルが旧版または非対応です');
    }

    return doc;
  }

  function offerUpdate(){
    if(destroyed)return;

    const toast=document.getElementById('toast');
    clearTimeout(toastTimer);
    toast.textContent='最新版があります。メモを引き継いで更新できます。';
    toast.hidden=false;

    const applyButton=document.createElement('button');
    applyButton.className='action primary';
    applyButton.textContent='メモを引き継いで更新';
    listen(applyButton,'click',()=>{
      applyLatest(pendingHTML,pendingSHA);
    });

    const laterButton=document.createElement('button');
    laterButton.className='action';
    laterButton.textContent='今は更新しない';
    listen(laterButton,'click',()=>{
      toast.hidden=true;
    });

    toast.append(document.createElement('br'),applyButton,laterButton);
    status.textContent='最新版があります。更新するか選べます。';
  }

  function cleanup(){
    destroyed=true;

    lifecycle.abort();
    observer.disconnect();

    clearInterval(updateInterval);
    clearTimeout(startTimer);
    clearTimeout(resizeTimer);
    clearTimeout(toastTimer);
    clearTimeout(qrTimeout);

    if(qrScript){
      qrScript.onload=null;
      qrScript.onerror=null;
    }

    fetchControllers.forEach(controller=>controller.abort());
    fetchControllers.clear();
  }

  function applyLatest(html,sha){
    if(destroyed || !html || !/^[0-9a-f]{40}$/i.test(sha))return;

    let doc;
    try{
      doc=validateHTML(html);
    }catch(error){
      say('更新ファイルを検証できませんでした。現在のV5を維持します。');
      return;
    }

    /*
     * メモの一時退避に失敗した場合は更新を止め、
     * コピーによる保護を案内する。
     */
    const saved=saveView();
    if(!saved && note.value.trim()){
      say('メモを引き継げません。先にメモをコピーしてから更新してください。');
      return;
    }

    try{
      sessionStorage.setItem(APPLIED_KEY,sha);
    }catch(error){}

    /*
     * 最新HTMLのlp-codeは、このV5と同様に
     * 関数スコープで実行される構成を維持してください。
     * URLを変えず、文書全体を最新版へ置き換えます。
     */
    const latest='<!DOCTYPE html>\n'+doc.documentElement.outerHTML;

    cleanup();
    document.open();
    document.write(latest);
    document.close();
  }

  async function checkLatest(force=false){
    if(
      !updateEnabled ||
      checking ||
      destroyed ||
      document.visibilityState==='hidden'
    )return;

    const now=Date.now();
    if(!force && now-lastCheck<60000)return;

    checking=true;
    lastCheck=now;
    updateLabel('GitHubの最新版を確認中…');

    try{
      const repository=
        'https://api.github.com/repos/'+
        encodeURIComponent(CONFIG.owner)+'/'+
        encodeURIComponent(CONFIG.repo);

      const commitsURL=new URL(repository+'/commits');
      commitsURL.searchParams.set('sha',CONFIG.branch);
      commitsURL.searchParams.set('path',CONFIG.path);
      commitsURL.searchParams.set('per_page','1');

      const commits=await getFresh(commitsURL.href,'json');
      if(destroyed)return;

      if(!Array.isArray(commits) || !commits.length){
        throw new Error('対象ファイルのコミットがありません');
      }

      const sha=commits[0].sha;
      if(typeof sha!=='string' || !/^[0-9a-f]{40}$/i.test(sha)){
        throw new Error('コミットSHAが不正です');
      }

      if(rememberedSHA()===sha){
        updateLabel('適用済みコミット '+sha.slice(0,7));
        return;
      }

      const filePath=CONFIG.path.split('/')
        .map(part=>encodeURIComponent(part))
        .join('/');

      const rawURL=
        'https://raw.githubusercontent.com/'+
        encodeURIComponent(CONFIG.owner)+'/'+
        encodeURIComponent(CONFIG.repo)+'/'+
        sha+'/'+filePath;

      const html=await getFresh(rawURL,'text');
      if(destroyed)return;

      let doc;
      try{
        doc=validateHTML(html);
      }catch(error){
        updateLabel('公開元が旧版または非対応です。現在のV5を維持します。');
        return;
      }

      if(signature(doc)===initialSignature){
        pendingHTML='';
        pendingSHA='';
        updateLabel('最新内容を確認 '+sha.slice(0,7));
        return;
      }

      pendingHTML=html;
      pendingSHA=sha;
      updateLabel('最新版あり '+sha.slice(0,7));

      /*
       * メモ入力中は自動で置き換えず、本人の操作を待つ。
       * メモが空なら、表示位置と選んだ気持ちを退避して適用。
       */
      if(note.value.trim()){
        offerUpdate();
      }else{
        applyLatest(pendingHTML,pendingSHA);
      }
    }catch(error){
      if(!destroyed){
        updateLabel('更新確認できませんでした。現在の表示を維持します。');
        console.warn('HPV LP update check:',error);
      }
    }finally{
      checking=false;
    }
  }

  /*
   * 起動時・5分ごと・タブ復帰時・通信復帰時に確認。
   * 通信やAPI制限で失敗しても、現在のガイドは閲覧できます。
   * 医療情報の自動収集ではなく、公開元HTMLの更新確認です。
   */
  if(updateEnabled){
    updateLabel('公開環境：最新コミットを確認します。');

    startTimer=setTimeout(()=>{
      if(!destroyed)checkLatest(true);
    },1500);

    updateInterval=setInterval(()=>{
      if(!destroyed)checkLatest();
    },5*60*1000);

    listen(document,'visibilitychange',()=>{
      if(document.visibilityState==='visible'){
        checkLatest();
      }
    });

    listen(window,'online',()=>{
      checkLatest(true);
    });
  }else{
    updateLabel('プレビュー／ローカル：自動更新は停止しています。');
  }

  })();
  </script>
