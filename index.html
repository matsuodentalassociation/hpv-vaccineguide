const main=document.getElementById('main');
const contents=document.getElementById('contents');
chapters.forEach((chapter,i)=>{
  const a=document.createElement('a');
  a.href='#chapter-'+i;
  a.textContent=(i+1)+' '+chapter.label;
  contents.appendChild(a);
  const section=document.createElement('section');
  section.className='chapter';
  section.id='chapter-'+i;
  section.setAttribute('aria-label',(i+1)+'. '+chapter.label);
  const nextLabel=i<chapters.length-1?chapters[i+1].label:'はじめに戻る';
  section.innerHTML=`
    <div class="chapter-head">
      <span class="chapter-label">${String(i+1).padStart(2,'0')} / 09　${chapter.label}</span>
      <span class="counter" aria-live="polite">1 / ${chapter.cards.length}</span>
    </div>
    <div class="track" tabindex="0" aria-label="${chapter.label}の横スワイプカード"></div>
    <div class="slider-controls">
      <button class="arrow prev" aria-label="前のカード">←</button>
      <div class="dots" aria-label="カードを選ぶ"></div>
      <button class="arrow forward" aria-label="次のカード">→</button>
    </div>`;
  main.appendChild(section);
  const track=section.querySelector('.track');
  const dots=section.querySelector('.dots');
  chapter.cards.forEach((card,j)=>{
    const article=document.createElement('article');
    article.className='card '+(card.tone||(j===0?'cover':''));
    article.setAttribute('aria-label',`${j+1} / ${chapter.cards.length} ${card.title.replace(/\n/g,' ')}`);
    article.innerHTML=`
      <div class="eyebrow">${card.tag}</div>
      <h2>${card.title}</h2>
      <div class="body">${card.text.split('|').map(p=>'<p>'+p+'</p>').join('')}</div>
      ${card.note?'<div class="note">'+card.note+'</div>':''}
      ${card.extra||''}
      ${card.source?`<div class="source"><a href="${card.source.url}" target="_blank" rel="noopener noreferrer">${card.source.label} ↗</a></div>`:''}
      ${card.memo?`
        <label for="personal-memo" class="eyebrow">自分の気持ち・質問</label>
        <textarea id="personal-memo" placeholder="私は今、こう思っている…"></textarea>
        <div class="memo-actions">
          <button class="small-button" id="copy-memo">メモをコピー</button>
          <button class="small-button" id="share-memo">メモを共有</button>
        </div>
        <div class="status" id="memo-status" role="status"></div>`:''}
      <div class="card-bottom">
        <div class="more">${j<chapter.cards.length-1?'横へ → '+chapter.cards[j+1].tag+'　／　今は下へ進んでもOK':'このテーマの最後です。前のカードにも戻れます。'}</div>
        <button class="next" data-next="${i}">
          <span>${i<chapters.length-1?'次のテーマへ：':''}${nextLabel}</span>
          <span aria-hidden="true">${i<chapters.length-1?'↓':'↑'}</span>
        </button>
      </div>`;
    track.appendChild(article);
    const dot=document.createElement('button');
    dot.className='dot'+(j===0?' active':'');
    dot.setAttribute('aria-label',`${j+1}枚目：${card.tag}`);
    dot.setAttribute('aria-current',j===0?'true':'false');
    dot.addEventListener('click',()=>goSlide(i,j));
    dots.appendChild(dot);
  });
  section.querySelector('.prev').addEventListener('click',()=>goSlide(i,currentSlide(i)-1));
  section.querySelector('.forward').addEventListener('click',()=>goSlide(i,currentSlide(i)+1));
  track.addEventListener('scroll',()=>{
    const idx=currentSlide(i);
    section.querySelector('.counter').textContent=`${idx+1} / ${chapter.cards.length}`;
    dots.querySelectorAll('button').forEach((d,k)=>{
      d.classList.toggle('active',k===idx);
      d.setAttribute('aria-current',k===idx?'true':'false');
    });
    section.querySelector('.prev').disabled=idx===0;
    section.querySelector('.forward').disabled=idx===chapter.cards.length-1;
  },{passive:true});
  track.addEventListener('keydown',e=>{
    if(e.target!==track)return;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      e.preventDefault();
      goSlide(i,currentSlide(i)+(e.key==='ArrowRight'?1:-1));
    }
  });
  section.querySelector('.prev').disabled=true;
});
const motion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
function currentSlide(i){
  const track=document.querySelector('#chapter-'+i+' .track');
  const left=track.getBoundingClientRect().left;
  const padding=parseFloat(getComputedStyle(track).paddingLeft);
  let best=0,distance=Infinity;
  [...track.children].forEach((card,j)=>{
    const d=Math.abs(card.getBoundingClientRect().left-left-padding);
    if(d<distance){distance=d;best=j;}
  });
  return best;
}
function goSlide(i,j){
  const track=document.querySelector('#chapter-'+i+' .track');
  const idx=Math.max(0,Math.min(j,track.children.length-1));
  const padding=parseFloat(getComputedStyle(track).paddingLeft);
  const shift=track.children[idx].getBoundingClientRect().left-track.getBoundingClientRect().left-padding;
  track.scrollTo({left:track.scrollLeft+shift,behavior:motion()});
}
document.addEventListener('click',e=>{
  const next=e.target.closest('[data-next]');
  if(next){
    const i=Number(next.dataset.next);
    if(i<chapters.length-1){
      document.getElementById('chapter-'+(i+1)).scrollIntoView({behavior:motion(),block:'start'});
    }else{window.scrollTo({top:0,behavior:motion()});}
  }
  const jump=e.target.closest('[data-jump]');
  if(jump){
    const i=Number(jump.dataset.jump);
    goSlide(i,Number(jump.dataset.slide));
    document.getElementById('chapter-'+i).scrollIntoView({behavior:motion(),block:'start'});
  }
});
async function copyMemo(){
  const area=document.getElementById('personal-memo');
  const status=document.getElementById('memo-status');
  if(!area.value.trim()){
    status.textContent='空欄のままでも大丈夫。コピーしたい言葉を書いてください。';
    return;
  }
  try{
    await navigator.clipboard.writeText(area.value);
    status.textContent='コピーしました。送りたい相手へのメッセージなどに貼り付けられます。';
  }catch(err){
    area.focus();area.select();
    status.textContent='メモを選択しました。端末のコピー操作で残してください。';
  }
}
document.getElementById('copy-memo').addEventListener('click',copyMemo);
document.getElementById('share-memo').addEventListener('click',async()=>{
  const text=document.getElementById('personal-memo').value;
  const status=document.getElementById('memo-status');
  if(!text.trim()){status.textContent='共有したい言葉を書いてください。';return;}
  if(navigator.share){
    try{await navigator.share({title:'HPVワクチンについて相談したいこと',text});}
    catch(err){if(err.name!=='AbortError')status.textContent='共有できませんでした。コピーして送れます。';}
  }else{await copyMemo();}
});
